<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 476" width="980" height="476" role="img" aria-label="One alert, end to end: code gathers facts, the LLM drafts a ticket, code checks it and decides close or escalate; tickets are grouped into incidents, and escalated tickets get containment proposals that people approve and run.">
<title>One alert, end to end: code gathers facts, the LLM drafts a ticket, code checks it and decides close or escalate; tickets are grouped into incidents, and escalated tickets get containment proposals that people approve and run.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6860"/></marker></defs>
<rect x="1" y="1" width="978" height="474" rx="16" fill="#FFFFFF" stroke="#E2DFD7" stroke-width="1.5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="16" y="16" width="948" height="124" rx="13" fill="#FAFAF8" stroke="#E2DFD7" stroke-width="1.2"/>
<text x="32" y="38" font-size="12" font-weight="600" fill="#5A5852" text-anchor="start">Level 1: triage each alert</text>
<rect x="36" y="52" width="164" height="70" rx="9" fill="#F3F2EE" stroke="#A8A398" stroke-width="1.3"/>
<text x="118.0" y="76.5" font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">Alert arrives</text>
<text x="118.0" y="93.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">any format,</text>
<text x="118.0" y="108.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">any field names</text>
<rect x="222" y="52" width="164" height="70" rx="9" fill="#F3F2EE" stroke="#A8A398" stroke-width="1.3"/>
<text x="304.0" y="76.5" font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">Gather the facts</text>
<text x="304.0" y="93.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">assets, people, changes,</text>
<text x="304.0" y="108.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">threat data, logs</text>
<rect x="408" y="52" width="164" height="70" rx="9" fill="#DDF2EA" stroke="#1D9E75" stroke-width="1.3"/>
<text x="490.0" y="76.5" font-size="13.5" font-weight="600" fill="#0B3D2E" text-anchor="middle">LLM drafts a ticket</text>
<text x="490.0" y="93.5" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle">verdict, evidence, flags;</text>
<text x="490.0" y="108.5" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle">at most 3 calls</text>
<rect x="594" y="52" width="164" height="70" rx="9" fill="#F3F2EE" stroke="#A8A398" stroke-width="1.3"/>
<text x="676.0" y="76.5" font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">Code checks the draft</text>
<text x="676.0" y="93.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">evidence, approvals,</text>
<text x="676.0" y="108.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">final severity</text>
<rect x="780" y="52" width="164" height="70" rx="9" fill="#F3F2EE" stroke="#A8A398" stroke-width="1.3"/>
<text x="862.0" y="76.5" font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">Close or escalate</text>
<text x="862.0" y="93.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">decided by code,</text>
<text x="862.0" y="108.5" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">from the policy</text>
<path d="M200,87 L222,87" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M386,87 L408,87" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M572,87 L594,87" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M758,87 L780,87" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="176" width="466" height="112" rx="13" fill="#FAFAF8" stroke="#E2DFD7" stroke-width="1.2"/>
<text x="32" y="198" font-size="12" font-weight="600" fill="#5A5852" text-anchor="start">Level 2: judgement</text>
<rect x="91" y="210" width="316" height="62" rx="9" fill="#F3F2EE" stroke="#A8A398" stroke-width="1.3"/>
<text x="249.0" y="238.0" font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">Group tickets into incidents</text>
<text x="249.0" y="255.0" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">by exact shared identifiers, within 14 days</text>
<rect x="16" y="308" width="466" height="112" rx="13" fill="#FAFAF8" stroke="#E2DFD7" stroke-width="1.2"/>
<text x="32" y="330" font-size="12" font-weight="600" fill="#5A5852" text-anchor="start">Level 3: investigation</text>
<rect x="91" y="342" width="316" height="62" rx="9" fill="#FFFFFF" stroke="#A8A398" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="249.0" y="370.0" font-size="13.5" font-weight="600" fill="#5A5852" text-anchor="middle">Incident report with a timeline</text>
<text x="249.0" y="387.0" font-size="11.5" font-weight="400" fill="#7A776F" text-anchor="middle">not built yet</text>
<rect x="498" y="176" width="466" height="244" rx="13" fill="#FAFAF8" stroke="#E2DFD7" stroke-width="1.2"/>
<text x="514" y="198" font-size="12" font-weight="600" fill="#5A5852" text-anchor="start">Level 4: response</text>
<rect x="573" y="206" width="316" height="56" rx="9" fill="#F3F2EE" stroke="#A8A398" stroke-width="1.3"/>
<text x="731.0" y="231.0" font-size="13.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">Containment proposal</text>
<text x="731.0" y="248.0" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="middle">one of 7 actions, exact target, who approves</text>
<rect x="573" y="284" width="316" height="56" rx="9" fill="#E3ECF8" stroke="#3B6DB3" stroke-width="1.3"/>
<text x="731.0" y="309.0" font-size="13.5" font-weight="600" fill="#14325C" text-anchor="middle">People approve</text>
<text x="731.0" y="326.0" font-size="11.5" font-weight="400" fill="#2E5A94" text-anchor="middle">a different named person for each role</text>
<rect x="573" y="362" width="316" height="48" rx="9" fill="#E3ECF8" stroke="#3B6DB3" stroke-width="1.3"/>
<text x="731.0" y="383.0" font-size="13.5" font-weight="600" fill="#14325C" text-anchor="middle">A person clicks run</text>
<text x="731.0" y="400.0" font-size="11.5" font-weight="400" fill="#2E5A94" text-anchor="middle">the mock API runs it once</text>
<path d="M731,262 L731,282" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M731,340 L731,360" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M249,272 L249,340" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M249,140 L249,174" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="259" y="148" width="88.80000000000001" height="18" rx="5" fill="#FFFFFF" stroke="#E2DFD7"/>
<text x="303.4" y="161" font-size="11" font-weight="500" fill="#5A5852" text-anchor="middle">every ticket</text>
<path d="M731,140 L731,174" fill="none" stroke="#6B6860" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="741" y="148" width="120.80000000000001" height="18" rx="5" fill="#FFFFFF" stroke="#E2DFD7"/>
<text x="801.4" y="161" font-size="11" font-weight="500" fill="#5A5852" text-anchor="middle">escalated tickets</text>
<rect x="36" y="442" width="14" height="14" rx="3" fill="#F3F2EE" stroke="#A8A398"/>
<text x="56" y="453" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="start">Plain code</text>
<rect x="148.0" y="442" width="14" height="14" rx="3" fill="#DDF2EA" stroke="#1D9E75"/>
<text x="168.0" y="453" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="start">LLM</text>
<rect x="213.8" y="442" width="14" height="14" rx="3" fill="#E3ECF8" stroke="#3B6DB3"/>
<text x="233.8" y="453" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="start">A person</text>
<rect x="312.6" y="442" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#A8A398" stroke-dasharray="3 2"/>
<text x="332.6" y="453" font-size="11.5" font-weight="400" fill="#5A5852" text-anchor="start">Not built yet</text>
</g>
</svg>
